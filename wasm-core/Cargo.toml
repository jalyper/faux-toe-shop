[package]
name = "faux-toe-shop-wasm"
version = "0.1.0"
authors = ["Faux-Toe-Shop Team"]
edition = "2021"
description = "High-performance WebAssembly image processing core for faux-toe-shop"
repository = "https://github.com/user/faux-toe-shop"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.93"
js-sys = "0.3.70"
console_error_panic_hook = { version = "0.1.7", optional = true }

# For parallel processing (optional, requires SharedArrayBuffer)
# rayon = "1.8"
# wasm-bindgen-rayon = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.43"

[profile.release]
# Optimize for size and speed
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Enable SIMD for maximum performance (requires wasm-simd feature in browsers)
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
